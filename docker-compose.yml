version: '3.8'

services:
  backend:
    image: cwlumm/lyftr-backend:latest
    build: ./backend
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    # The API itself runs unprivileged (see backend/entrypoint.sh). Drop every
    # capability, then add back only the four the entrypoint needs to chown a
    # freshly created bind mount and step down to the lyftr user. Notably absent:
    # NET_RAW, NET_BIND_SERVICE, SYS_ADMIN, MKNOD.
    #
    # no-new-privileges still applies: it blocks *gaining* privileges through a
    # setuid binary, which is unrelated to root voluntarily dropping them.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    environment:
      # Controls Gin's debug/release mode and demo-data seeding (see backend/config/config.go).
      # Defaults to production for self-host deployments; override in .env only for local debugging.
      - ENV=${ENV:-production}
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
      - DB_TYPE=sqlite
      - DB_PATH=/app/data/lyftr.db
      # The frontend's nginx is the only hop in front of the backend, and it
      # sits on the Docker bridge network. Trusting exactly that range lets the
      # rate limiter see real client IPs without letting a client forge one.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-172.16.0.0/12}
      # Registration is closed by default. Set ALLOW_REGISTRATION=true (and
      # optionally REGISTRATION_INVITE_CODE) long enough to create accounts,
      # then set it back.
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-false}
      - REGISTRATION_INVITE_CODE=${REGISTRATION_INVITE_CODE:-}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mcp:
    image: cwlumm/lyftr-mcp:latest
    build:
      context: https://github.com/walshy828/lyftr.git#main:mcp
    restart: unless-stopped
    # Optional: only needed if you want an MCP client on another machine (e.g.
    # a laptop with Claude Desktop) to connect over the network via the
    # mcp-remote bridge — see mcp/README.md. Skip this service entirely if you
    # only ever run lyftr-mcp as a local stdio subprocess on the same machine
    # as your MCP client.
    environment:
      - MCP_TRANSPORT=http
      - MCP_LISTEN_ADDR=:8811
      # backend:3000 is reachable on the internal Docker network directly —
      # unlike an external client, this container doesn't need to go through
      # the frontend's nginx proxy.
      - LYFTR_API_URL=http://backend:3000/api/v1
      # Create this in the web app under Settings > Personal access tokens,
      # then set it in your .env file.
      - LYFTR_TOKEN=${LYFTR_MCP_TOKEN}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Bound to loopback, not 0.0.0.0. This endpoint carries a long-lived
    # personal access token over plain HTTP, so exposing it on the LAN puts
    # that token on the wire in cleartext for anything sniffing the network.
    # For a remote MCP client, tunnel over SSH/Tailscale or put TLS in front —
    # or set MCP_BIND=0.0.0.0 if you have accepted that trade-off.
    ports:
      - "${MCP_BIND:-127.0.0.1}:${MCP_PORT:-8811}:8811"
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    image: cwlumm/lyftr-frontend:latest
    build: ./web
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      # host:port the frontend nginx proxies /api to. Must match the backend's PORT.
      - BACKEND_ORIGIN=${BACKEND_ORIGIN:-backend:3000}
    ports:
      - "${PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
